<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">How OpenBridge works</title>
  <desc id="d">You choose one folder on Android and start sharing. The phone shows its address, port, certificate fingerprint and a pairing secret. You enter them on the Mac, which verifies the certificate before sending the secret. Then you browse, download and upload over one TLS connection per request.</desc>
  <style>
    .bg { fill: #f6f8fb; }
    .card { fill: #ffffff; stroke: #d0d7e2; }
    .ink { fill: #0f1b2d; }
    .muted { fill: #5b6b80; }
    .line { stroke: #2f6fed; }
    .accent { fill: #2f6fed; }
    .accent2 { fill: #0f9d76; }
    .badge { fill: #eaf1ff; }
    .warn { fill: #fff5e0; stroke: #e7b54a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9aa7b6; }
      .line { stroke: #6ea0ff; }
      .accent { fill: #6ea0ff; }
      .accent2 { fill: #3fd0a3; }
      .badge { fill: #1b2638; }
      .warn { fill: #2a2312; stroke: #9c7a2b; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="accent" d="M0 0 L10 5 L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="20"/>
  <text class="ink" x="40" y="56" font-size="28" font-weight="700">How it works</text>

  <!-- Column headers -->
  <text class="muted" x="200" y="100" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.5">ANDROID PHONE</text>
  <text class="muted" x="1000" y="100" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.5">MAC</text>

  <!-- Step 1 -->
  <rect class="card" x="40" y="118" width="320" height="86" rx="14" stroke-width="1.5"/>
  <circle class="accent" cx="72" cy="150" r="16"/><text x="72" y="156" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text class="ink" x="100" y="152" font-size="18" font-weight="600">Choose one folder</text>
  <text class="muted" x="100" y="180" font-size="14">Only that folder is ever shared.</text>

  <!-- Step 2 -->
  <rect class="card" x="40" y="222" width="320" height="150" rx="14" stroke-width="1.5"/>
  <circle class="accent" cx="72" cy="254" r="16"/><text x="72" y="260" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text class="ink" x="100" y="258" font-size="18" font-weight="600">Start sharing</text>
  <rect class="badge" x="100" y="272" width="240" height="88" rx="8"/>
  <text class="muted" x="112" y="293" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IP</text>
  <text class="ink" x="184" y="293" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">192.168.1.23</text>
  <text class="muted" x="112" y="312" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Port</text>
  <text class="ink" x="184" y="312" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">41987</text>
  <text class="muted" x="112" y="331" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SHA-256</text>
  <text class="ink" x="184" y="331" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">9f3c…e1a0</text>
  <text class="muted" x="112" y="350" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Secret</text>
  <text class="ink" x="184" y="350" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">new every start</text>

  <!-- Step 3 -->
  <rect class="card" x="840" y="222" width="320" height="150" rx="14" stroke-width="1.5"/>
  <circle class="accent" cx="872" cy="254" r="16"/><text x="872" y="260" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text class="ink" x="900" y="258" font-size="18" font-weight="600">Pair</text>
  <text class="muted" x="900" y="288" font-size="14">Type the four values shown</text>
  <text class="muted" x="900" y="308" font-size="14">on the phone. The Mac checks</text>
  <text class="muted" x="900" y="328" font-size="14">the certificate fingerprint</text>
  <text class="muted" x="900" y="348" font-size="14">before it sends the secret.</text>

  <!-- Step 4 -->
  <rect class="card" x="840" y="390" width="320" height="96" rx="14" stroke-width="1.5"/>
  <circle class="accent" cx="872" cy="422" r="16"/><text x="872" y="428" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text class="ink" x="900" y="426" font-size="18" font-weight="600">Browse and transfer</text>
  <text class="muted" x="900" y="454" font-size="14">Download to the Mac, upload</text>
  <text class="muted" x="900" y="472" font-size="14">to the phone. Never overwrites.</text>

  <!-- Channel -->
  <path class="line" d="M372 296 H828" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text class="muted" x="600" y="284" font-size="14" text-anchor="middle">you read the values off the phone screen</text>

  <path class="line" d="M828 438 H372" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="card" x="460" y="408" width="280" height="60" rx="12" stroke-width="1.5"/>
  <text class="ink" x="600" y="434" font-size="15" font-weight="600" text-anchor="middle">TLS 1.2+ · pinned certificate</text>
  <text class="muted" x="600" y="454" font-size="13" text-anchor="middle">over Wi-Fi or USB tethering</text>

  <rect class="card" x="40" y="390" width="320" height="96" rx="14" stroke-width="1.5"/>
  <text class="ink" x="60" y="424" font-size="16" font-weight="600">Stops automatically when</text>
  <text class="muted" x="60" y="450" font-size="14">you leave the app, press Stop,</text>
  <text class="muted" x="60" y="470" font-size="14">or the network or cable drops.</text>

  <!-- Never -->
  <rect class="warn" x="400" y="118" width="400" height="86" rx="14" stroke-width="1.5"/>
  <text class="ink" x="600" y="150" font-size="16" font-weight="600" text-anchor="middle">Never</text>
  <text class="muted" x="600" y="176" font-size="14" text-anchor="middle">accounts · cloud · internet exposure · telemetry</text>
</svg>
