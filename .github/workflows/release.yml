name: Release
on:
  push:
    tags: ['v*']
  # Or run from the Actions tab on main: the release tag is created on the built commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (must match the apps and CHANGELOG.md)'
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check the tag matches app versions and the changelog
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$VERSION_INPUT"
            [ "$GITHUB_REF_NAME" = main ] || { echo "::error::Run releases from main"; exit 1; }
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 1.2.3"; exit 1; }
          grep -q "versionName = \"$version\"" android/app/build.gradle.kts || { echo "::error::android versionName is not $version"; exit 1; }
          grep -q "<key>CFBundleShortVersionString</key><string>$version</string>" macos/Info.plist || { echo "::error::macOS version is not $version"; exit 1; }
          grep -q "orElse(\"$version\")" desktop/build.gradle.kts || { echo "::error::Windows version is not $version"; exit 1; }
          python3 scripts/release-notes.py "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-protocol.sh
      - run: python3 scripts/test-tls.py
      - run: python3 scripts/check-repository.py
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the APK, signed with the release key when it is configured
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/release.p12"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            OPENBRIDGE_KEYSTORE="$keystore" gradle :protocol:check :android:app:assembleRelease :android:app:lintRelease --stacktrace
            apk=android/app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > certs.txt
            grep -m1 'certificate SHA-256 digest' certs.txt | sed 's/.*digest: //' > android-signing-sha256.txt
            # Only the project's release key may sign a published APK (see docs/releasing.md).
            expected=4e41b5c80d00e40b264abfe65c986a8b6d1f4fdff7e6d17eeb66105ae4bb1685
            actual="$(tr -d ': \n' < android-signing-sha256.txt | tr 'A-F' 'a-f')"
            [ "$actual" = "$expected" ] || { echo "::error::APK signed with $actual, not the OpenBridge release key $expected. Check the ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          else
            # 1.0 and later must never ship with a throwaway key: updates would refuse to install.
            case "$VERSION" in
              0.*) echo "::warning::No release key configured; publishing a debug-signed preview APK." ;;
              *) echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets (see docs/releasing.md) before releasing $VERSION."; exit 1 ;;
            esac
            gradle :protocol:check :android:app:assembleDebug :android:app:lintDebug --stacktrace
            apk=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$apk" "OpenBridge-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            OpenBridge-*.apk
            android-signing-sha256.txt
          if-no-files-found: error
  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-protocol.sh
      - name: Generate ephemeral TLS test certificate
        run: keytool -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore "$RUNNER_TEMP/fixture.p12" -storepass test-only -keypass test-only -dname CN=OpenBridge-CI -validity 1
      - name: Swift unit and cross-language TLS tests
        run: swift test --package-path macos
        env:
          FIXTURE_CLASSPATH: ${{ github.workspace }}/build/protocol-tests
          FIXTURE_KEYSTORE: ${{ runner.temp }}/fixture.p12
      - run: bash scripts/build-macos.sh
      - run: bash scripts/package-macos.sh "OpenBridge-${{ needs.verify.outputs.version }}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OpenBridge-*-macOS.dmg
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: bash scripts/fetch-scrcpy-windows.sh desktop/build/app-resources
      - run: gradle -PdesktopOnly -PappVersion=${{ needs.verify.outputs.version }} :desktop:test :desktop:createDistributable :desktop:packageExe --stacktrace
      - name: Check the app carries screen mirroring
        run: |
          app=desktop/build/compose/binaries/main/app/OpenBridge
          test -f "$app/OpenBridge.exe"
          test -f "$app/app/resources/scrcpy/scrcpy.exe" && test -f "$app/app/resources/scrcpy/adb.exe"
      - name: Zip the app (unzip anywhere and run OpenBridge.exe)
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/OpenBridge -DestinationPath "OpenBridge-${{ needs.verify.outputs.version }}-Windows.zip"
      - name: Name the installer
        run: cp desktop/build/compose/binaries/main/exe/OpenBridge-*.exe "OpenBridge-${{ needs.verify.outputs.version }}-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            OpenBridge-*-Windows.zip
            OpenBridge-*-Windows-Setup.exe
          if-no-files-found: error
  publish:
    needs: [verify, android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "${{ needs.verify.outputs.version }}" > notes.md
          # Publish the Android signing fingerprint in the notes, not as a download.
          if [ -f dist/android-signing-sha256.txt ]; then
            printf '\n**Android signing certificate (SHA-256):** `%s`\n' "$(cat dist/android-signing-sha256.txt)" >> notes.md
            rm dist/android-signing-sha256.txt
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          tag="v${{ needs.verify.outputs.version }}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "OpenBridge $tag" --notes-file notes.md
