name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check the tag matches app versions and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" android/app/build.gradle.kts || { echo "::error::android versionName is not $version"; exit 1; }
          grep -q "<key>CFBundleShortVersionString</key><string>$version</string>" macos/Info.plist || { echo "::error::macOS version is not $version"; exit 1; }
          python3 scripts/release-notes.py "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-protocol.sh
      - run: python3 scripts/test-tls.py
      - run: python3 scripts/check-repository.py
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :protocol:check :android:app:assembleDebug :android:app:lintDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "OpenBridge-${{ needs.verify.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenBridge-*.apk
  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-protocol.sh
      - name: Generate ephemeral TLS test certificate
        run: keytool -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore "$RUNNER_TEMP/fixture.p12" -storepass test-only -keypass test-only -dname CN=OpenBridge-CI -validity 1
      - name: Swift unit and cross-language TLS tests
        run: swift test --package-path macos
        env:
          FIXTURE_CLASSPATH: ${{ github.workspace }}/build/protocol-tests
          FIXTURE_KEYSTORE: ${{ runner.temp }}/fixture.p12
      - run: bash scripts/build-macos.sh
      - run: ditto -c -k --keepParent macos/build/OpenBridge.app "OpenBridge-${{ needs.verify.outputs.version }}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OpenBridge-*-macOS.zip
  publish:
    needs: [verify, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "${{ needs.verify.outputs.version }}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenBridge $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
