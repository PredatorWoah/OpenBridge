name: Test APK
# Run from the Actions tab on any branch: an APK signed with the release key, for testing fixes on a real phone before a
# release. It installs over the current release (same key, next build number). Nothing is published; the APK is an
# artifact of the run.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the test APK with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUILD: ${{ github.run_number }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::The release key secrets are not configured (see docs/releasing.md)."; exit 1; }
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          OPENBRIDGE_KEYSTORE="$keystore" gradle -PtestBuild="$BUILD" :protocol:check :android:app:assembleRelease :android:app:lintRelease --stacktrace
          apk=android/app/build/outputs/apk/release/app-release.apk
          expected=4e41b5c80d00e40b264abfe65c986a8b6d1f4fdff7e6d17eeb66105ae4bb1685
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //' | tr -d ': \n' | tr 'A-F' 'a-f')"
          [ "$actual" = "$expected" ] || { echo "::error::APK signed with $actual, not the OpenBridge release key."; exit 1; }
          mkdir out && cp "$apk" "out/OpenBridge-test-$BUILD.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-test-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
