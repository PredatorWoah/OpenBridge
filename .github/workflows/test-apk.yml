name: Test APK
# Run from the Actions tab on any branch: a debug APK for testing fixes on a real phone before a release, signed with the
# public test key in android/test-signing so each one installs over the last. Nothing is published; the APK is an
# artifact of the run. Uninstall the release once before the first one (different key).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the debug test APK
        env:
          BUILD: ${{ github.run_number }}
        run: |
          gradle -PtestBuild="$BUILD" :protocol:check :android:app:assembleDebug :android:app:lintDebug --stacktrace
          mkdir out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/OpenBridge-debug-$BUILD.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/OpenBridge-debug-$BUILD.apk" | grep -m1 'SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-debug-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
