name: Build and protocol checks
on:
  # Cheap Linux checks run on every push and pull request; native builds stay manual.
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-protocol.sh
      - run: python3 scripts/test-tls.py
  mtp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-mtp.sh
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: bash scripts/test-protocol.sh
      - run: python3 scripts/test-tls.py
      - run: gradle :protocol:check :android:app:assembleDebug :android:app:lintDebug :desktop:test --stacktrace
      - name: Check release signing with a throwaway key
        run: |
          keytool -genkeypair -alias ci -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore "$RUNNER_TEMP/ci.p12" \
            -storepass ci-only-password -dname CN=OpenBridge-CI -validity 1
          OPENBRIDGE_KEYSTORE="$RUNNER_TEMP/ci.p12" OPENBRIDGE_KEYSTORE_PASSWORD=ci-only-password OPENBRIDGE_KEY_ALIAS=ci \
            gradle :android:app:assembleRelease :android:app:lintRelease --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q 'CN=OpenBridge-CI' certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-protocol.sh
      - name: Generate ephemeral TLS test certificate
        run: keytool -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore "$RUNNER_TEMP/fixture.p12" -storepass test-only -keypass test-only -dname CN=OpenBridge-CI -validity 1
      - name: Swift unit and cross-language TLS tests
        run: swift test --package-path macos
        env:
          FIXTURE_CLASSPATH: ${{ github.workspace }}/build/protocol-tests
          FIXTURE_KEYSTORE: ${{ runner.temp }}/fixture.p12
      - run: bash scripts/build-macos.sh
      - run: bash scripts/package-macos.sh macos/build/OpenBridge-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-macOS
          path: macos/build/OpenBridge-macOS.dmg
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: bash scripts/fetch-scrcpy-windows.sh desktop/build/app-resources
      - run: gradle -PdesktopOnly :desktop:test :desktop:createDistributable :desktop:packageExe --stacktrace
      - name: Check the app carries screen mirroring
        run: |
          app=desktop/build/compose/binaries/main/app/OpenBridge
          test -f "$app/OpenBridge.exe"
          test -f "$app/app/resources/scrcpy/scrcpy.exe" && test -f "$app/app/resources/scrcpy/adb.exe"
      - name: Launch the packaged app and check it keeps running
        shell: pwsh
        run: |
          $app = Start-Process -FilePath desktop/build/compose/binaries/main/app/OpenBridge/OpenBridge.exe -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { Write-Error "OpenBridge.exe exited at startup with code $($app.ExitCode)"; exit 1 }
          Stop-Process -Id $app.Id -Force
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/OpenBridge -DestinationPath desktop/build/OpenBridge-Windows.zip
      - name: Check the installer was built
        run: ls -l desktop/build/compose/binaries/main/exe/OpenBridge-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-Windows
          path: |
            desktop/build/OpenBridge-Windows.zip
            desktop/build/compose/binaries/main/exe/OpenBridge-*.exe
  linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Tools for the .deb and a virtual display
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb
      - run: bash scripts/fetch-scrcpy-linux.sh desktop/build/app-resources
      - run: gradle -PdesktopOnly :desktop:test :desktop:createDistributable :desktop:packageDeb --stacktrace
      - name: Check the app carries screen mirroring
        run: |
          app=desktop/build/compose/binaries/main/app/OpenBridge
          test -x "$app/bin/OpenBridge"
          test -x "$app/lib/app/resources/scrcpy/scrcpy" && test -x "$app/lib/app/resources/scrcpy/adb"
          test -f "$app/lib/app/resources/scrcpy/scrcpy-server"
      - name: Launch the app on a virtual display and check it keeps running
        run: |
          set +e
          timeout 20 xvfb-run -a desktop/build/compose/binaries/main/app/OpenBridge/bin/OpenBridge
          code=$?
          set -e
          # 124: still running when the time was up, as it should be.
          [ "$code" = 124 ] || { echo "::error::OpenBridge exited at startup with code $code"; exit 1; }
      - name: Pack the portable app
        run: tar -C desktop/build/compose/binaries/main/app -czf desktop/build/OpenBridge-Linux-x86_64.tar.gz OpenBridge
      - name: Check the package was built
        run: ls -l desktop/build/compose/binaries/main/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-Linux
          path: |
            desktop/build/OpenBridge-Linux-x86_64.tar.gz
            desktop/build/compose/binaries/main/deb/*.deb
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-repository.py
