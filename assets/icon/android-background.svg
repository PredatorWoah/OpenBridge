<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#3a2470"/><stop offset=".55" stop-color="#1d1546"/><stop offset="1" stop-color="#0d0b26"/>
    </radialGradient>
    <linearGradient id="left" x1="176" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="right" x1="512" y1="0" x2="848" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5c8a"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflect" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect x="0" y="634" width="1024" height="330" fill="url(#fade)"/></mask>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <g id="arch">
      <path d="M232 620 A280 280 0 0 1 516.9 340.04" fill="none" stroke="url(#left)" stroke-width="112" stroke-linecap="butt"/>
      <path d="M512 340 A280 280 0 0 1 792 620" fill="none" stroke="url(#right)" stroke-width="112" stroke-linecap="butt"/>
    </g>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="haze" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- Glass highlight: bright along the top of the arch, fading out towards the waterline. -->
    <linearGradient id="shine" x1="0" y1="300" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".55" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset=".6" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glint" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <!-- Liquid-glass edge light: strongest at the top, where the light catches the rim. -->
    <linearGradient id="rim" x1="0" y1="280" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="280" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf0"/><stop offset=".6" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
  </defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Glass sheen across the top of the icon. -->
  <ellipse cx="512" cy="-60" rx="820" ry="460" fill="url(#sheen)"/>
</svg>
